# Copiar a .streamlit/secrets.toml y completar.
# NUNCA commitear el archivo real.

[gcp_service_account]
type = "service_account"
project_id = "..."
private_key_id = "..."
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = "..."
client_id = "..."
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
universe_domain = "googleapis.com"

# Libro FUENTE: reportes crudos generados por el bot de WhatsApp (Neurolinks)
[google_sheets.source]
spreadsheet_id = "..."
worksheet_name = "Hoja 1"

# Libro DESTINO: persistencia de datos procesados y clasificaciones
# (pestañas YYYY-MM_Bot y YYYY-MM_Bitrix). Se crea con scripts/create_destination_sheet.py
[google_sheets.dest]
spreadsheet_id = "..."

[bitrix24]
webhook_url = "https://<portal>.bitrix24.com/rest/<user>/<token>/"
